<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="English Grammar Rules for Indian Competitive Exams (SSC, Banking, Railways)">
    <title>Eng Grama - English Grammar Rules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-row header-row-1">
                <a href="#" class="logo" aria-label="Eng Grama Home">
                    <svg class="logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                        <rect width="32" height="32" rx="8" fill="currentColor"/>
                        <path d="M8 12h16M8 16h12M8 20h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                    <span class="logo-text">Eng Grama</span>
                </a>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
            <div class="header-row header-row-2">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="search" id="searchInput" class="search-input" placeholder="Search rules or topics..." aria-label="Search grammar rules" autocomplete="off">
                </div>
            </div>
        </div>
    </header>

    <div class="mobile-filter-bar" id="mobileFilterBar">
        <button class="category-toggle" id="categoryToggle" aria-label="Open categories drawer" aria-expanded="false">
            <span class="toggle-label">Categories</span>
            <svg class="toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <span class="rule-count-badge" id="ruleCountBadge">40 rules</span>
    </div>

    <main class="main">
        <div class="container">
            <div class="layout">
                <aside class="sidebar" id="sidebar" aria-label="Categories">
                    <div class="sidebar-header">
                        <h2 class="sidebar-title">Categories</h2>
                        <button class="sidebar-close" id="sidebarClose" aria-label="Close categories">×</button>
                    </div>
                    <nav class="category-nav" id="categoryNav" aria-label="Grammar categories">
                    </nav>
                </aside>

                <div class="content">
        <div class="desktop-rule-count">
            <span class="rule-count" id="ruleCount">40 rules</span>
        </div>
                    <section class="rules-section" aria-label="Grammar Rules">
                        <div class="rules-grid" id="rulesGrid" role="list">
                        </div>
                        <div class="empty-state" id="emptyState" hidden>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="M21 21l-4.35-4.35"/>
                                <path d="M8 8l6 6M14 8l-6 6"/>
                            </svg>
                            <h3>No rules found</h3>
                            <p>Try adjusting your search or category filter</p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Built for SSC, Banking, Railways & other competitive exams</p>
        </div>
    </footer>

    <script src="data/rules.js"></script>
    <script src="script.js"></script>
</body>
</html>
